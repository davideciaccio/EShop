<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EShop - Acquisto Confermato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<header>
    <nav class="navbar">
        <!-- Logo ingrandito -->
        <div class="nav-brand">
            <a href="home.html">
                <img src="images/logo_eshop.jpg" alt="E-Shop Logo">
            </a>
        </div>

        <div class="nav-search">
            <!-- Il form porta sempre alla home come richiesto dal punto 3c -->
            <form action="home.html" method="GET" id="searchForm">
                <input type="text" id="searchInput" placeholder="Cerca prodotti..." required>
                <button type="submit">Cerca</button>
            </form>
        </div>

        <div class="nav-user-info">

            <!-- Menu Account (Dropdown) con Omino SVG inline -->
            <div class="account-dropdown-container">
                <!-- SVG Omino Nero -->
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <div class="account-text-group">
                    <span>Ciao, Cliente!</span>
                    <div class="account-trigger">Account</div>
                </div>
                <div class="dropdown-menu">
                    <a href="#">Il mio account</a>
                    <a href="#">I miei ordini</a>
                    <a href="#">La mia lista dei desideri</a>
                    <a href="login.html">Esci</a>
                </div>
            </div>

            <!-- Icona Carrello (Codice SVG Inline) con Testo integrato -->
            <a href="carrello.html" style="display: flex; align-items: center; gap: 8px; color: black; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shopping-cart">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span style="font-size: 1.1em; font-weight: bold;">Carrello</span>
            </a>

        </div>
    </nav>
</header>

<!-- CONTENUTO DI CONFERMA ACQUISTO -->
<main class="confirmation-wrapper">
    <div class="confirmation-content">
        <!-- Spunta verde in SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="green" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>

        <h1 class="success-message">Acquisto avvenuto con successo!</h1>

        <a href="home.html" class="continue-shopping-btn">Continua a fare acquisti</a>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p>&copy; 2026 E-Shop. Tutti i diritti riservati.</p>
</footer>

<!-- Script Javascript -->
<script src="js/script.js"></script>
</body>
</html>
