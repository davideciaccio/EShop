<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EShop - Carrello</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Inclusione jQuery per far funzionare lo script.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<header>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="home.html">
                <img src="images/logo_eshop.jpg" alt="E-Shop Logo">
            </a>
        </div>

        <div class="nav-search-wrapper">
            <select id="categoryFilter" onchange="window.location.href='home.html'">
                <option value="all">Filtra per categoria (vai alla Home)</option>
            </select>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Cerca prodotti (vai alla Home)...">
                <button type="button" onclick="window.location.href='home.html'">Cerca</button>
            </div>
        </div>

        <div class="nav-user-info">
            <div class="account-dropdown-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <div class="account-text-group">
                    <span>Ciao, Cliente!</span>
                    <div class="account-trigger">Account</div>
                </div>
                <div class="dropdown-menu">
                    <a href="#">Il mio account</a>
                    <a href="#">I miei ordini</a>
                    <a href="login.html">Esci</a>
                </div>
            </div>

            <a href="carrello.html" style="display: flex; align-items: center; gap: 8px; color: black; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shopping-cart">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span style="font-size: 1.1em; font-weight: bold;">Carrello</span>
            </a>
        </div>
    </nav>
</header>

<!-- CONTENUTO PRINCIPALE CARRELLO -->
<main class="cart-container">

    <section class="cart-items-section">
        <h2>Il tuo carrello</h2>
        <div id="mainCartItemsContainer">
            <p>Caricamento carrello in corso...</p>
        </div>
    </section>

    <!-- SIDEBAR DESTRA: RIEPILOGO TOTALE -->
    <aside class="cart-summary-sidebar">
        <h3>Riepilogo Ordine</h3>
        <div class="summary-row">
            <span>Subtotale articoli:</span>
            <span id="mainSubtotale">0,00 €</span>
        </div>
        <div class="summary-row">
            <span>Costi di spedizione:</span>
            <span>Gratis</span>
        </div>
        <div class="summary-total">
            <span>Totale:</span>
            <span id="mainTotaleFinale">0,00 €</span>
        </div>
        <a href="checkout.html" style="text-decoration: none;">
            <button class="btn-action" style="font-size: 1.1em; padding: 15px;">Procedi al Check-out</button>
        </a>
    </aside>

</main>

<!-- FOOTER -->
<footer>
    <p>© 2026 E-Shop. Tutti i diritti riservati.</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
