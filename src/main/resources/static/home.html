<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EShop - Home</title>
  <link rel="stylesheet" href="css/style.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="position: relative; padding-bottom: 0;">

<!-- NAVBAR -->
<header>
  <nav class="navbar">
    <div class="nav-brand">
      <a href="home.html" class="brand-link">
        <img src="images/logo_eshop.jpg" alt="E-Shop Logo">
        <span class="brand-slogan">Tutto, in un click.</span>
      </a>
    </div>

    <div class="nav-search-wrapper">
      <div class="nav-search">
        <input type="text" id="searchInput" placeholder="Cerca prodotti...">
        <button type="button" id="searchButton">Cerca</button>
      </div>
    </div>

    <div class="nav-user-info">
      <div class="account-dropdown-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <div class="account-text-group">
          <span>Ciao, Cliente!</span>
          <div class="account-trigger">Account</div>
        </div>
        <div class="dropdown-menu">
          <a href="#">Il mio account</a>
          <a href="#">I miei ordini</a>
          <a href="login.html">Esci</a>
        </div>
      </div>

      <a href="carrello.html" class="cart-link">
        <span class="cart-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shopping-cart">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span id="cartCounter" class="cart-counter">0</span>
        </span>
        <span class="cart-label">Carrello</span>
      </a>
    </div>
  </nav>
</header>

<!-- CONTENUTO PRINCIPALE -->
<main class="container" style="flex-direction: column;">
  <div style="display: flex; gap: 30px; width: 100%;">

    <!-- SIDEBAR SINISTRA -->
    <aside class="sidebar">
      <h3>Ordina Per</h3>
      <select id="sortFilter" style="width: 100%; padding: 8px; margin-top: 10px; border: 2px solid #000; border-radius: 4px;">
        <option value="default">Rilevanza</option>
        <option value="priceAsc">Prezzo: Crescente</option>
        <option value="priceDesc">Prezzo: Decrescente</option>
        <option value="nameAsc">Nome: A-Z</option>
        <option value="nameDesc">Nome: Z-A</option>
      </select>

      <h3 style="margin-top: 20px;">Categorie</h3>
      <select id="categoryFilter" style="width: 100%; padding: 8px; margin-top: 10px; border: 2px solid #000; border-radius: 4px;">
        <option value="elettronica">Elettronica</option>
        <option value="libri">Libri</option>
        <option value="abbigliamento">Abbigliamento</option>
      </select>
    </aside>

    <!-- LISTA PRODOTTI -->
    <div style="flex: 1; display: flex; flex-direction: column;">
      <h3 id="noResultsMessage" style="display: none; text-align: center; margin-top: 50px; color: red;">Nessun prodotto trovato.</h3>
      <section class="products-grid" id="productsContainer"></section>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <p>© 2026 E-Shop. Tutti i diritti riservati.</p>
</footer>

<!-- MODALE DETTAGLI -->
<div id="modalInfo" class="modal">
  <div class="modal-content">
    <h3 id="infoTitolo" style="margin-bottom: 15px;">Titolo Prodotto</h3>

    <div class="img-container" style="height: auto; max-height: 250px; margin-bottom: 10px;">
      <img id="infoImmagine" src="" alt="Dettaglio Prodotto">
    </div>

    <p id="infoBrand" style="font-weight: bold; font-size: 1.1em; margin-bottom: 15px;">Brand</p>
    <p id="infoDescrizione" style="margin: 15px 0; line-height: 1.5;">Descrizione...</p>
    <p id="infoPrezzo" style="font-size: 1.3em; font-weight: bold; margin-bottom: 10px;">0,00 €</p>

    <p style="margin-bottom: 20px; font-size: 1em;">
      <span style="color: #000000;">Disponibilità: </span>
      <span id="infoDisponibilita" style="color: green; font-weight: bold;">N/A</span>
    </p>

    <div style="display: flex; gap: 15px; justify-content: center;">
      <button class="btn-action add-to-cart-btn" id="modalAddToCartBtn">Aggiungi al carrello</button>
      <button class="close-btn" id="closeModalInfoBtn" style="margin-top: 0;">Chiudi</button>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script src="js/home.js"></script>
</body>
</html>
